[tox]
envlist = py,quality
requires = tox-uv>=1

[testenv]
runner = uv-venv-lock-runner
dependency_groups = test
commands =
    coverage run -m pytest
    coverage report

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
commands =
    pycodestyle --config=.pep8 src/calc src/symmath tests
    pylint --rcfile=pylintrc src/calc src/symmath tests
